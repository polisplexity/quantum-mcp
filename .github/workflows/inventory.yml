name: Inventory metadata

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.12'
      - run: python tools/validate_inventory.py
      - run: python -m pip install -r cases/qiskit-helsinki/requirements-pilot.txt
      - run: python cases/qiskit-helsinki/run_bell_pilot.py
